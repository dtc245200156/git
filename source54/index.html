<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu mẫu thông tin & đăng ký học viên</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px 16px 60px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .page {
            width: min(100%, 920px);
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .intro {
            text-align: center;
            color: #6b7280;
            margin: 0 0 28px;
        }

        .form-card {
            margin-bottom: 28px;
            padding: 28px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
        }

        .form-card h2 {
            margin-top: 0;
        }

        .field {
            margin-bottom: 18px;
        }

        label,
        .legend {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            background: #fff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 3px solid rgba(37, 99, 235, 0.15);
            border-color: #2563eb;
        }

        .required {
            color: #dc2626;
        }

        .inline-group {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 400;
        }

        .check-item input {
            width: 18px;
            height: 18px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            min-height: 44px;
            padding: 0 20px;
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .submit {
            background: #2563eb;
            color: #fff;
        }

        .reset {
            background: #e5e7eb;
            color: #111827;
        }

        .submit:hover {
            background: #1d4ed8;
        }

        .reset:hover {
            background: #d1d5db;
        }

        @media (min-width: 700px) {
            .grid-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 18px;
            }

            .grid-2 .field {
                margin-bottom: 0;
            }

            .grid-2 + .field {
                margin-top: 18px;
            }
        }

        @media (max-width: 520px) {
            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <h1>Biểu mẫu thông tin</h1>
        <p class="intro">Thực hành TextBox, CheckBox, Submit, Reset và form đăng ký học viên.</p>

        <section class="form-card">
            <h2>Phần 1: Form thông tin cá nhân</h2>

            <form action="#" method="post">
                <div class="field">
                    <label for="yourname">Họ và tên</label>
                    <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com">
                </div>

                <fieldset class="field">
                    <legend class="legend">Sở thích</legend>
                    <div class="inline-group">
                        <label class="check-item">
                            <input type="checkbox" name="hobby" value="reading"> Đọc sách
                        </label>
                        <label class="check-item">
                            <input type="checkbox" name="hobby" value="music"> Nghe nhạc
                        </label>
                        <label class="check-item">
                            <input type="checkbox" name="hobby" value="travel"> Du lịch
                        </label>
                        <label class="check-item">
                            <input type="checkbox" name="hobby" value="sports"> Thể thao
                        </label>
                    </div>
                </fieldset>

                <div class="buttons">
                    <button type="submit" class="submit">Gửi thông tin</button>
                    <button type="reset" class="reset">Nhập lại</button>
                </div>
            </form>
        </section>

        <section class="form-card">
            <h2>Phần 2: Form đăng ký học viên</h2>

            <form action="#" method="post">
                <div class="grid-2">
                    <div class="field">
                        <label for="fullName">Họ và tên <span class="required">*</span></label>
                        <input type="text" id="fullName" name="fullName" placeholder="Nguyễn Văn A" required>
                    </div>

                    <div class="field">
                        <label for="studentEmail">Email <span class="required">*</span></label>
                        <input type="email" id="studentEmail" name="studentEmail" placeholder="student@example.com" required>
                    </div>
                </div>

                <div class="grid-2" style="margin-top: 18px;">
                    <div class="field">
                        <label for="phone">Số điện thoại <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="09xxxxxxxx" required>
                    </div>

                    <div class="field">
                        <label for="birthDate">Ngày sinh</label>
                        <input type="date" id="birthDate" name="birthDate">
                    </div>
                </div>

                <div class="field" style="margin-top: 18px;">
                    <label for="course">Khóa học <span class="required">*</span></label>
                    <select id="course" name="course" required>
                        <option value="">-- Chọn khóa học --</option>
                        <option value="frontend">Lập trình Front-end</option>
                        <option value="backend">Lập trình Back-end</option>
                        <option value="fullstack">Lập trình Full-stack</option>
                        <option value="testing">Kiểm thử phần mềm</option>
                    </select>
                </div>

                <fieldset class="field">
                    <legend class="legend">Giới tính</legend>
                    <div class="inline-group">
                        <label class="check-item">
                            <input type="radio" name="gender" value="male"> Nam
                        </label>
                        <label class="check-item">
                            <input type="radio" name="gender" value="female"> Nữ
                        </label>
                        <label class="check-item">
                            <input type="radio" name="gender" value="other"> Khác
                        </label>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="address">Địa chỉ</label>
                    <input type="text" id="address" name="address" placeholder="Nhập địa chỉ">
                </div>

                <div class="field">
                    <label for="note">Ghi chú</label>
                    <textarea id="note" name="note" placeholder="Thông tin bổ sung..."></textarea>
                </div>

                <div class="buttons">
                    <button type="submit" class="submit">Đăng ký học viên</button>
                    <button type="reset" class="reset">Nhập lại</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
