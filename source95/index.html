<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Responsive Gallery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .gallery-image {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-item:hover .gallery-image {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .gallery-item {
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
<main class="container py-5">
    <header class="text-center mb-5">
        <h1 class="fw-bold">Responsive Image Gallery</h1>
        <p class="text-secondary mb-0">
            Bootstrap Grid System: col-lg-3 · col-sm-6 · col-12
        </p>
    </header>

    <section class="row g-4" aria-label="Gallery ảnh">
        <div class="col-12 col-sm-6 col-lg-3 gallery-item">
            <img
                class="gallery-image"
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80"
                alt="Phong cảnh núi và hồ"
            >
        </div>

        <div class="col-12 col-sm-6 col-lg-3 gallery-item">
            <img
                class="gallery-image"
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80"
                alt="Hồ nước giữa núi rừng"
            >
        </div>

        <div class="col-12 col-sm-6 col-lg-3 gallery-item">
            <img
                class="gallery-image"
                src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80"
                alt="Dãy núi trong thiên nhiên"
            >
        </div>

        <div class="col-12 col-sm-6 col-lg-3 gallery-item">
            <img
                class="gallery-image"
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80"
                alt="Con đường giữa rừng cây"
            >
        </div>

        <div class="col-12 col-sm-6 col-lg-3 gallery-item">
            <img
                class="gallery-image"
                src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=80"
                alt="Thung lũng dưới bầu trời xanh"
            >
        </div>

        <div class="col-12 col-sm-6 col-lg-3 gallery-item">
            <img
                class="gallery-image"
                src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80"
                alt="Thiên nhiên xanh mát"
            >
        </div>

        <div class="col-12 col-sm-6 col-lg-3 gallery-item">
            <img
                class="gallery-image"
                src="https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=900&q=80"
                alt="Hồ nước phản chiếu núi"
            >
        </div>

        <div class="col-12 col-sm-6 col-lg-3 gallery-item">
            <img
                class="gallery-image"
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
                alt="Phong cảnh thiên nhiên rộng lớn"
            >
        </div>
    </section>
</main>
</body>
</html>
