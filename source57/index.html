<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: min(100%, 800px);
            margin: 0 auto;
            padding: 32px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
        }

        th,
        td {
            border: 1px solid #cbd5e1;
            padding: 13px 14px;
            text-align: left;
        }

        th {
            background: #e8eef8;
        }

        tr:nth-child(even) td {
            background: #f8fafc;
        }

        td:nth-child(2),
        td:nth-child(3) {
            text-align: center;
        }

        @media (max-width: 560px) {
            .container {
                padding: 22px 16px;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Danh sách sản phẩm</h1>

        <table>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
            <tr>
                <td>Bàn phím cơ</td>
                <td>850.000đ</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Chuột không dây</td>
                <td>450.000đ</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Tai nghe Bluetooth</td>
                <td>1.200.000đ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Webcam Full HD</td>
                <td>950.000đ</td>
                <td>8</td>
            </tr>
        </table>
    </main>
</body>
</html>
