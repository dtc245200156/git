<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trang xác nhận đăng ký thành công.">
  <title>Đăng ký thành công | FlowUI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="success-page">
  <main class="success-shell">
    <section class="success-card" aria-labelledby="success-title">
      <div class="success-badge" aria-hidden="true">✓</div>
      <p class="step-label">BƯỚC 2 / 2</p>
      <h1 id="success-title">Đăng ký thành công!</h1>
      <p class="success-text">
        Tài khoản của bạn đã được tạo. Chào mừng bạn đến với FlowUI.
      </p>

      <div class="next-step">
        <span class="next-icon" aria-hidden="true">✉</span>
        <div>
          <strong>Kiểm tra email</strong>
          <p>Chúng tôi sẽ gửi thông tin tiếp theo tới địa chỉ email bạn đã đăng ký.</p>
        </div>
      </div>

      <div class="success-actions">
        <a class="primary-button button-link" href="index.html">Quay lại trang đăng ký</a>
        <a class="secondary-button" href="#">Đi tới trang chủ</a>
      </div>
    </section>
  </main>
</body>
</html>
