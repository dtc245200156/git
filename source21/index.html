<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center mb-2">Đăng Ký Tài Khoản</h1>
                        <p class="text-center text-muted mb-4">
                            Vui lòng điền đầy đủ thông tin bên dưới
                        </p>

                        <form>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Họ và tên</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    name="fullName"
                                    placeholder="Nhập họ và tên"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="name@example.com"
                                    required>
                                <div class="form-text">
                                    Chúng tôi sẽ không chia sẻ email của bạn.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Nhập mật khẩu"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Nhập lại mật khẩu"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Giới tính</label>

                                <div class="form-check form-check-inline">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="male"
                                        value="male"
                                        required>
                                    <label class="form-check-label" for="male">Nam</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="female"
                                        value="female">
                                    <label class="form-check-label" for="female">Nữ</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="other"
                                        value="other">
                                    <label class="form-check-label" for="other">Khác</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Sở thích</label>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="coding" name="hobbies" value="coding">
                                    <label class="form-check-label" for="coding">Lập trình</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="reading" name="hobbies" value="reading">
                                    <label class="form-check-label" for="reading">Đọc sách</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="music" name="hobbies" value="music">
                                    <label class="form-check-label" for="music">Nghe nhạc</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="travel" name="hobbies" value="travel">
                                    <label class="form-check-label" for="travel">Du lịch</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="country" class="form-label">Quốc gia</label>
                                <select class="form-select" id="country" name="country" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="vietnam">Việt Nam</option>
                                    <option value="japan">Nhật Bản</option>
                                    <option value="korea">Hàn Quốc</option>
                                    <option value="singapore">Singapore</option>
                                    <option value="usa">Hoa Kỳ</option>
                                    <option value="other">Khác</option>
                                </select>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Đăng Ký
                                </button>
                            </div>
                        </form>

                        <p class="text-center text-muted mt-4 mb-0">
                            Bằng việc đăng ký, bạn đồng ý với các điều khoản sử dụng.
                        </p>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
