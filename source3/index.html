<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Column Start</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thuộc tính grid-column-start</h1>

    <div class="grid">

        <div class="item item1">
            Item 1 - auto
        </div>

        <div class="item item2">
            Item 2 - bắt đầu từ cột 2
        </div>

        <div class="item item3">
            Item 3 - bắt đầu từ cột 3
        </div>

        <div class="item item4">
            Item 4 - span 2
        </div>

        <div class="item item5">
            Item 5 - span 3
        </div>

        <div class="item item6">
            Item 6
        </div>

    </div>

</body>
</html>
