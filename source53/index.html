<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gộp ô trong bảng</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 32px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th,
        td {
            border: 1px solid #9ca3af;
            padding: 14px 12px;
        }

        th {
            background: #e8eef8;
        }

        td[rowspan] {
            font-weight: 700;
            background: #f8fafc;
        }

        td[colspan] {
            font-weight: 700;
            background: #fff4d6;
        }

        @media (max-width: 560px) {
            .container {
                padding: 22px 16px;
            }

            th,
            td {
                padding: 10px 7px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h2>Thời khóa biểu</h2>

        <table>
            <tr>
                <th>Thứ</th>
                <th>Môn học</th>
                <th>Giáo viên</th>
            </tr>
            <tr>
                <td rowspan="2">Thứ Hai</td>
                <td>Toán</td>
                <td>Thầy Nam</td>
            </tr>
            <tr>
                <td>Văn</td>
                <td>Cô Hạnh</td>
            </tr>
            <tr>
                <td>Thứ Ba</td>
                <td colspan="2">Nghỉ học</td>
            </tr>
        </table>
    </main>
</body>
</html>
