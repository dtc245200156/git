<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ với chúng tôi</title>
</head>
<body>
  <h1>Liên hệ với chúng tôi</h1>
  <p>Chúng tôi rất mong nhận được phản hồi từ bạn!</p>

  <form action="#" method="post">
    <div>
      <label for="ho_ten">Họ và tên:</label><br>
      <input type="text" id="ho_ten" name="ho_ten">
    </div>
    <br>
    <div>
      <label for="email">Email của bạn:</label><br>
      <input type="email" id="email" name="email_nguoi_dung">
    </div>
    <br>
    <div>
      <label for="loi_nhan">Lời nhắn:</label><br>
      <textarea id="loi_nhan" name="loi_nhan" rows="5"></textarea>
    </div>
    <br>
    <div>
      <button type="submit">Gửi lời nhắn</button>
    </div>
  </form>
</body>
</html>
