<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng đơn giản trong HTML</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 32px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #b8c0cc;
            padding: 12px 14px;
            text-align: left;
        }

        th {
            background: #e9eef7;
        }

        tr:nth-child(even) td {
            background: #f8fafc;
        }

        @media (max-width: 560px) {
            .container {
                padding: 20px 16px;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h2>Danh sách học sinh</h2>

        <table>
            <tr>
                <th>Họ và Tên</th>
                <th>Tuổi</th>
                <th>Lớp</th>
            </tr>
            <tr>
                <td>Nguyễn Văn A</td>
                <td>15</td>
                <td>10A1</td>
            </tr>
            <tr>
                <td>Trần Thị B</td>
                <td>16</td>
                <td>11B2</td>
            </tr>
            <tr>
                <td>Lê Văn C</td>
                <td>17</td>
                <td>12C3</td>
            </tr>
        </table>
    </main>
</body>
</html>
