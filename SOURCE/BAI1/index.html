<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - DIV CSS Responsive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>HEADER</h1>
        </div>

        <div class="menu">
            <div class="menu-item">Trang chủ</div>
            <div class="menu-item">Giới thiệu</div>
            <div class="menu-item">Sản phẩm</div>
            <div class="menu-item">Liên hệ</div>
        </div>

        <div class="main">

            <div class="sidebar">
                <h2>SIDEBAR</h2>
                <div class="box">Danh mục 1</div>
                <div class="box">Danh mục 2</div>
                <div class="box">Danh mục 3</div>
                <div class="box">Danh mục 4</div>
            </div>

            <div class="content">
                <h2>NỘI DUNG</h2>

                <div class="content-row">
                    <div class="card">
                        <h3>Khối 1</h3>
                        <p>Nội dung của khối thứ nhất.</p>
                    </div>

                    <div class="card">
                        <h3>Khối 2</h3>
                        <p>Nội dung của khối thứ hai.</p>
                    </div>

                    <div class="card">
                        <h3>Khối 3</h3>
                        <p>Nội dung của khối thứ ba.</p>
                    </div>
                </div>
            </div>

        </div>

        <div class="footer">
            <p>FOOTER - Bài tập DIV và CSS</p>
        </div>

    </div>

</body>
</html>
