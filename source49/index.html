<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hình ảnh trong HTML</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px; background: #f4f7fb; color: #1f2937;">
    <main style="max-width: 820px; margin: 0 auto; padding: 32px; background: #ffffff; border-radius: 18px; box-shadow: 0 12px 35px rgba(31, 41, 55, 0.1);">
        <h1>Hình ảnh yêu thích</h1>
        <p>Trang này minh họa cách sử dụng thẻ <code>&lt;img&gt;</code> để hiển thị hình ảnh.</p>

        <img
            src="images/landscape.svg"
            alt="Phong cảnh núi, hồ nước và bầu trời lúc hoàng hôn"
            style="display: block; width: 100%; max-width: 720px; height: auto; margin: 24px auto; border-radius: 14px;"
        >

        <p>
            Thuộc tính <code>alt</code> cung cấp mô tả thay thế cho hình ảnh khi hình ảnh
            không thể hiển thị và hỗ trợ khả năng tiếp cận.
        </p>
    </main>
</body>
</html>
