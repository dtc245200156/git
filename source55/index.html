<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký người dùng</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .register-card {
            width: min(100%, 520px);
            margin: 0 auto;
            padding: 32px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        .intro {
            margin: 0 0 26px;
            text-align: center;
            color: #6b7280;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label,
        legend {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(37, 99, 235, 0.13);
            border-color: #2563eb;
        }

        fieldset {
            margin: 0 0 22px;
            padding: 0;
            border: 0;
        }

        .gender-options {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .gender-option {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-weight: 400;
        }

        .gender-option input {
            width: 17px;
            height: 17px;
        }

        .submit-button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .note {
            margin-top: 14px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 520px) {
            .register-card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <main class="register-card">
        <h1>Đăng ký người dùng</h1>
        <p class="intro">Vui lòng nhập đầy đủ thông tin để đăng ký.</p>

        <form
            action="http://demo.codegym.vn/6/registration_form/register.php"
            method="POST"
        >
            <div class="field">
                <label for="name">Họ và tên</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Nhập họ và tên"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="phone">Số điện thoại</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Nhập số điện thoại"
                    autocomplete="tel"
                    required
                >
            </div>

            <fieldset>
                <legend>Giới tính</legend>

                <div class="gender-options">
                    <label class="gender-option">
                        <input type="radio" name="gender" value="male" required>
                        Nam
                    </label>

                    <label class="gender-option">
                        <input type="radio" name="gender" value="female">
                        Nữ
                    </label>

                    <label class="gender-option">
                        <input type="radio" name="gender" value="other">
                        Khác
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="submit-button">Đăng ký</button>
        </form>

        <p class="note">
            Form sử dụng phương thức POST và gửi dữ liệu trực tiếp đến server theo yêu cầu bài tập.
        </p>
    </main>
</body>
</html>
