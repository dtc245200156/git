<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trời Hà Nội xanh</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: orange;
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .author {
            text-align: right;
            font-size: 18px;
            margin-bottom: 16px;
        }

        .poem {
            text-align: right;
            text-indent: 2em;
            font-style: italic;
            font-size: 20px;
            line-height: 1.8;
        }

        .author strong {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Trời Hà Nội xanh</h1>

    <p class="author">
        Sáng tác: <strong>Văn Ký</strong>
    </p>

    <p class="poem">
        Xanh xanh thẳm bầu trời xanh Hà Nội<br>
        Hồ Gươm xanh như mái tóc em xanh
    </p>

</body>
</html>
